<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voting Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<main class="vote-page">


<section class="vote-card">


<header class="vote-header">

<h1>
Voting Console
</h1>

<p>
Anonymous • Secure • Real-Time
</p>

</header>



<div id="status" class="vote-status">

Waiting for next vote...

</div>



<div id="buttons" class="vote-actions hidden">


<button id="yesButton" class="vote-button yes-button">

YES

</button>


<button id="noButton" class="vote-button no-button">

NO

</button>


</div>



<footer class="vote-footer">

Connected Device

</footer>


</section>


</main>



<script type="module" src="js/vote.js"></script>


</body>

</html>
