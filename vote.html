<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voting Console - Vote</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="vote-page">


    <div class="vote-card">


        <h1>
            Voting Console
        </h1>


        <p class="subtitle">
            Anonymous • Secure • Real-Time
        </p>



        <div id="status" class="vote-status">

            Waiting for next vote...

        </div>




        <div id="buttons" class="vote-buttons">


            <button id="yesButton" class="yes-button">

                YES

            </button>



            <button id="noButton" class="no-button">

                NO

            </button>


        </div>



        <div class="footer">

            Connected

        </div>


    </div>


</div>



<script type="module" src="js/vote.js"></script>


</body>

</html>
