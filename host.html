<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voting Console - Host</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="container">


<div class="card">


<h1 class="title">

Host Console

</h1>


<p class="subtitle" id="status">

Voting Closed

</p>



<div class="results">


<div class="result-row">

<span>YES</span>

<strong id="yesCount">0</strong>

</div>



<div class="result-row">

<span>NO</span>

<strong id="noCount">0</strong>

</div>



<div class="result-row">

<span>NOT VOTED</span>

<strong id="notVoted">7</strong>

</div>


</div>



<div class="menu">


<button id="openButton" class="blue">

OPEN VOTING

</button>


<button id="closeButton" class="blue">

CLOSE VOTING

</button>


<button id="resetButton" class="no">

RESET ROUND

</button>


</div>



</div>


</div>


<script type="module" src="js/host.js"></script>


</body>

</html>
